[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root
loglevel=info

[program:fastapi]
command=python3 /app/render_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
user=root
startsecs=5
startretries=3

[program:n8n]
command=n8n
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
user=node
environment=HOME="/home/node",N8N_USER_FOLDER="/home/node/.n8n"
startsecs=10
startretries=3